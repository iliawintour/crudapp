version: "3.7"
services:
  web-server:
    image: iliawintour/crudback:latest
    ports:
      - "8080:80"
    depends_on:
      - db
      - phpmyadmin
  db:
    image: iliawintour/mysql:latest
    environment:
      MYSQL_ROOT_PASSWORD: 'secret'
      MYSQL_DATABASE: 'lena'
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:5.0.1
    ports:
      - "5000:80"
    environment:
      PMA_HOST: db
volumes:
  mysql-data:
